name: Veille

on:
  schedule:
    # Toutes les heures, à la 23e minute (… 16 h 23, 17 h 23… à Nouméa).
    # GitHub retarde ou saute les passages planifiés à l'heure pile, les plus chargés :
    # avec « 0 */2 », à peine 3 ou 4 passages sur 12 avaient lieu chaque jour.
    # Le premier passage à partir de 17 h à Nouméa (06:23 UTC) envoie le récapitulatif par e-mail.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force_digest:
        description: Envoyer tout de suite le récapitulatif par e-mail (e-mail de test si rien n'est en attente)
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**/*.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    name: Vérifier les sources et publier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Lancer les tests
        if: github.event_name == 'push'
        run: npm test

      - name: Vérifier les sources
        env:
          VIGIE_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VIGIE_FORCE_DIGEST: ${{ inputs.force_digest && '1' || '' }}
        run: npm run scrape -- --digest recap.json

      - name: Envoyer le récapitulatif par e-mail
        if: hashFiles('recap.json') != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VIGIE_EMAIL_TO: ${{ secrets.VIGIE_EMAIL_TO }}
        run: node scripts/send-digest.js recap.json

      - name: Enregistrer les nouvelles annonces
        run: |
          git config user.name "vigie[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json data/snapshots data/alert-queue.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée à enregistrer."
          else
            git add data/status.json
            git commit -m "Veille : mise à jour des annonces"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
              sleep 5
            done
          fi

      - name: Préparer le site
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Un nom d'archive par tentative : quand on relance un passage, l'archive de la tentative
      # précédente est toujours là et la publication échouait avec « Multiple artifacts named ».
      - name: Envoyer le site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      # GitHub met parfois quelques secondes à lister l'archive qui vient d'être envoyée, et la
      # publication échoue alors avec « No artifacts named ». Attendre côté API REST ne suffit pas
      # (deploy-pages interroge un autre service, qui peut avoir encore plus de retard) :
      # on retente donc la publication elle-même, après 20 s puis 60 s.
      - name: Publier en ligne
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Patienter avant une nouvelle publication
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Publier en ligne (2e essai)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Patienter encore avant une nouvelle publication
        if: steps.deployment2.outcome == 'failure'
        run: sleep 60

      - name: Publier en ligne (3e essai)
        id: deployment3
        if: steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
